name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Configure npm for public npm registry
        # Write to the repo root (not ~/.npmrc): `bun publish` resolves auth from
        # the nearest .npmrc walking up from each package dir, not from $HOME.
        # `.npmrc` is gitignored, so the token never gets committed below.
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Version, commit, and publish
        # Single-merge release: when a feature PR carrying a changeset lands on
        # main, this consumes the changeset, commits the version bumps straight
        # back to main, then publishes — no separate "Version Packages" PR.
        run: |
          # Consume pending changesets: bump versions + write changelogs.
          bun run version

          # If anything changed, commit the bumps back to main.
          # [skip ci] avoids a redundant re-run of this workflow.
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Release: version packages [skip ci]"
            git push
          fi

          # Publish anything not already on npm (idempotent).
          bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

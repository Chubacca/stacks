name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The release commits the version bumps straight back to main.
      contents: write
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # Without it there is no credential at all — the publish step has no
      # token to fall back on.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # bun installs and runs changesets, but npm does the publishing: trusted
      # publishing is OIDC-based and `bun publish` cannot do OIDC. Node 24
      # ships an npm comfortably past the 11.5.1 floor trusted publishing
      # needs. No `NODE_AUTH_TOKEN`, and deliberately no cache — the registry
      # URL is all the npm CLI needs to recognise the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install

      - name: Version, commit, and publish
        # Single-merge release: when a feature PR carrying a changeset lands on
        # main, this consumes the changeset, commits the version bumps straight
        # back to main, then publishes — no separate "Version Packages" PR.
        run: |
          # Consume pending changesets: bump versions + write changelogs.
          bun run version

          # If anything changed, commit the bumps back to main.
          # [skip ci] avoids a redundant re-run of this workflow.
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Release: version packages [skip ci]"
            git push
          fi

          # Publish anything not already on npm (idempotent).
          bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
